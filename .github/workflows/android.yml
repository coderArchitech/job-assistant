name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, static checks and unit tests
        # Debug and release builds of both flavors (release runs R8), all unit tests,
        # Android Lint, detekt and ktlint. --continue reports every failure, not just the first.
        run: >-
          ./gradlew --continue
          assembleDevDebug assembleProdDebug assembleDevRelease assembleProdRelease
          unitTest staticChecks
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: "**/build/reports/**"
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew deviceTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: "**/build/reports/androidTests/**"
          retention-days: 7

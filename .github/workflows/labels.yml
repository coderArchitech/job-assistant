name: Labels

# Creates or updates the repository's labels from .github/labels.json.
# Labels missing from the file are left alone, never deleted.
on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r label; do
            name=$(jq -r '.name' <<< "$label")
            gh label create "$name" \
              --repo "$GITHUB_REPOSITORY" \
              --color "$(jq -r '.color' <<< "$label")" \
              --description "$(jq -r '.description' <<< "$label")" \
              --force
            echo "Synced label: $name"
          done

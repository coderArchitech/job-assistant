name: Release bundle

# Builds the Play upload bundle (prod flavor, release build) signed with the upload key.
# Runs on every push to main and on demand. Never on pull requests, so the key is only
# used for code that has already been reviewed and merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-bundle
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_UPLOAD_KEY: ${{ secrets.JOBASSISTANT_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check for the upload key
        if: env.HAS_UPLOAD_KEY != 'true'
        run: |
          echo "::warning::The upload key secrets are not set, so no signed bundle was built. See 'Release signing' in docs/TECHNICAL_DESIGN.md."
      - uses: actions/checkout@v5
        if: env.HAS_UPLOAD_KEY == 'true'
      - uses: actions/setup-java@v5
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        if: env.HAS_UPLOAD_KEY == 'true'
      - name: Write the upload key to a temporary file
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.JOBASSISTANT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          JOBASSISTANT_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          JOBASSISTANT_UPLOAD_STORE_PASSWORD: ${{ secrets.JOBASSISTANT_UPLOAD_STORE_PASSWORD }}
          JOBASSISTANT_UPLOAD_KEY_ALIAS: ${{ secrets.JOBASSISTANT_UPLOAD_KEY_ALIAS }}
          JOBASSISTANT_UPLOAD_KEY_PASSWORD: ${{ secrets.JOBASSISTANT_UPLOAD_KEY_PASSWORD }}
          JOBASSISTANT_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleProdRelease
      - name: Check the bundle is signed
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          bundle=app/build/outputs/bundle/prodRelease/app-prod-release.aab
          jarsigner -verify "$bundle" > /dev/null
          unzip -l "$bundle" | grep -qE 'META-INF/[^/]+\.(RSA|EC|DSA)$'
          echo "Signed bundle: $bundle (versionCode ${{ github.run_number }})"
      - name: Delete the upload key file
        if: always() && env.HAS_UPLOAD_KEY == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v6
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: app-prod-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/prodRelease/app-prod-release.aab
            app/build/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30

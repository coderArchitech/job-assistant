name: T1.01 SDK spike

# Spike branch only: runs each AI client variant inside the R8-shrunk app on emulators
# and reports first-call and warm-call times. Never merged to main.
on:
  push:
    branches: ["spike/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device:
    name: ${{ matrix.variant }} on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [none, thin, anthropic, openai]
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the shrunk app
        run: ./gradlew -Pspike=${{ matrix.variant }} :app:assembleDevSpike
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/dev/spike/app-dev-spike.apk
            adb logcat -c
            adb shell am start -W -n com.coderarchitech.jobassistant.dev/com.coderarchitech.jobassistant.MainActivity --ez spike true
            sleep 30
            adb logcat -d -s SPIKE:* AndroidRuntime:E > spike-result.txt; cat spike-result.txt
            grep -q "result=PASS" spike-result.txt

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Config host per flavor (task T3.10). Empty means "not configured yet".
jobassistant.configHost.dev=
jobassistant.configHost.prod=

# Ed25519 public keys that sign config host releases (D07), base64 of the raw 32-byte key, "current,next".
# Empty until the owner creates the keys (task T3.10): every download is then rejected and bundled config is used.
jobassistant.configKeys.dev=
jobassistant.configKeys.prod=

# Retry dependency downloads with back-off; Maven Central rate-limits busy networks (HTTP 429).
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000

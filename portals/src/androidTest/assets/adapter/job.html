<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sample portal: job</title></head>
<body>
<h1>Android Engineer</h1>
<span class="company">Acme</span> <span class="location">Bengaluru</span>
<div id="jd">Build the Android app in Kotlin and Compose.</div>
<span class="applied-badge" hidden>Applied</span>
<button id="apply" type="button">Apply</button>
<form id="form" hidden onsubmit="return false">
  <input id="name"> <input id="email">
  <select id="notice"><option value="">Notice period</option><option value="30">30 days</option><option value="60">60 days</option></select>
  <input id="cv" type="file">
  <button id="send" type="button">Send application</button>
</form>
<p id="thanks" hidden>Application sent</p>
<script>
  if (location.search.indexOf("applied") >= 0) document.querySelector(".applied-badge").hidden = false;
  document.getElementById("apply").addEventListener("click", function () { document.getElementById("form").hidden = false; });
  document.getElementById("send").addEventListener("click", function () {
    var form = document.getElementById("form");
    var cv = document.getElementById("cv").files[0];
    window.sent = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      notice: document.getElementById("notice").value,
      cv: cv ? cv.name + ":" + cv.size : null
    };
    form.hidden = true;
    document.getElementById("thanks").hidden = false;
  });
</script>
</body>
</html>

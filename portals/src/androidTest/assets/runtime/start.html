<!doctype html>
<html>
<head><meta charset="utf-8"><title>Runtime test page</title></head>
<body>
<p>A portal page used by the WebView runtime test.</p>
<a id="off" href="https://evil.example/steal">Off the allowlist</a>
<a id="linkedin" href="https://www.linkedin.com/in/someone">LinkedIn</a>
<a id="next" href="/assets/runtime/next.html">Next page</a>
<script>
  // The test calls these to navigate the way a hostile or broken page would.
  function go(url) { window.location.href = url; }
  function popUp(url) { window.open(url, "_blank"); }
  function submitTo(url) {
    var form = document.createElement("form");
    form.method = "post";
    form.action = url;
    document.body.appendChild(form);
    form.submit();
  }
</script>
</body>
</html>
